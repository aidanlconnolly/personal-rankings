<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Aidan's Recommendations · Books · TV · Movies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef0f4;
    --bg-soft: #e3e6ed;
    --marble-1: #f7f6f1;
    --marble-2: #dcd9d2;
    --marble-vein: rgba(120,128,140,0.18);
    --ink: #2a2823;
    --ink-soft: #6a6760;
    --muted: #9a978f;
    --gold: #c9a24c;
    --gold-2: #e8c87b;
    --gold-deep: #8e6a23;
    --silver: #b6b6b9;
    --silver-2: #e2e2e6;
    --silver-deep: #6e6e74;
    --bronze: #b46a3a;
    --bronze-2: #d9966a;
    --bronze-deep: #6b3a18;
    --accent: #4a5a6a;
    --line: rgba(58,62,72,0.18);
    --card-bg: rgba(255,255,255,0.55);
    --card-border: rgba(58,62,72,0.14);
    --shadow-soft: 0 12px 30px rgba(40,44,52,0.10), 0 2px 8px rgba(40,44,52,0.06);
    --shadow-strong: 0 28px 60px rgba(40,44,52,0.18), 0 8px 20px rgba(40,44,52,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { color: var(--ink); font-family: 'Cormorant Garamond', Georgia, serif; min-height: 100vh; overflow-x: hidden; }
  body {
    background:
      radial-gradient(ellipse 90% 70% at 30% 0%, #ffffff 0%, transparent 55%),
      radial-gradient(ellipse 70% 50% at 80% 100%, #d8dbe2 0%, transparent 60%),
      linear-gradient(180deg, #eef0f4 0%, #d9dce3 100%);
    background-attachment: fixed;
  }

  /* Marble veins overlay */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='1200' viewBox='0 0 1200 1200'><defs><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.012' numOctaves='2' seed='9'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.48  0 0 0 0 0.52  0 0 0 0.18 0'/></filter></defs><rect width='1200' height='1200' filter='url(%23n)'/></svg>");
    background-size: 800px 800px;
    opacity: 0.55;
    mix-blend-mode: multiply;
    pointer-events: none;
    z-index: -2;
  }
  /* Pillars silhouette */
  body::after {
    content: '';
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 220px;
    background:
      linear-gradient(180deg, transparent, rgba(80,86,96,0.10)),
      repeating-linear-gradient(90deg,
        transparent 0px,
        transparent 80px,
        rgba(120,128,140,0.10) 80px,
        rgba(120,128,140,0.10) 84px,
        transparent 84px,
        transparent 164px,
        rgba(120,128,140,0.06) 164px,
        rgba(120,128,140,0.06) 256px
      );
    mask-image: linear-gradient(180deg, transparent 0%, black 80%);
    pointer-events: none;
    z-index: -1;
    opacity: 0.55;
  }

  /* ─── HEADER ───────────────────────────────────────────────────────── */
  header.hero {
    text-align: center;
    padding: 70px 24px 30px;
    position: relative;
  }
  header.hero .brand-mark {
    display: inline-block;
    font-family: 'Cinzel', serif;
    font-weight: 600;
    letter-spacing: 6px;
    color: var(--ink-soft);
    font-size: 11px;
    margin-bottom: 18px;
    padding: 6px 18px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(255,255,255,0.4);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  header.hero h1 {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: clamp(38px, 6vw, 76px);
    letter-spacing: 4px;
    line-height: 1.05;
    color: var(--ink);
    background: linear-gradient(180deg, #3a3a3a 0%, #6f6f6f 60%, #4a4a4a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 2px 20px rgba(255,255,255,0.6);
  }
  header.hero h1 em {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    background: linear-gradient(180deg, #8e6a23 0%, #c9a24c 50%, #8e6a23 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header.hero .subhead {
    margin-top: 22px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(16px, 1.6vw, 20px);
    color: var(--ink-soft);
    max-width: 620px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.5;
  }
  header.hero .subhead .arrow {
    color: var(--gold-deep);
    margin: 0 6px;
  }
  header.hero .laurel {
    width: 180px;
    height: 28px;
    margin: 28px auto 0;
    position: relative;
  }
  header.hero .laurel::before, header.hero .laurel::after {
    content: '⚜';
    position: absolute;
    top: 0; font-size: 18px;
    color: var(--gold-deep);
    opacity: 0.7;
  }
  header.hero .laurel::before { left: 50%; transform: translateX(-50%); }
  header.hero .laurel > .line { position: absolute; top: 50%; height: 1px; width: 60px;
    background: linear-gradient(90deg, transparent, var(--gold-deep), transparent); }
  header.hero .laurel > .line.left { left: 0; }
  header.hero .laurel > .line.right { right: 0; }

  /* ─── TABS ─────────────────────────────────────────────────────────── */
  .tabs-wrap {
    display: flex; justify-content: center; flex-wrap: wrap;
    gap: 10px;
    padding: 0 24px;
    margin: 36px auto 8px;
    max-width: 1100px;
  }
  .tab {
    font-family: 'Cinzel', serif;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: linear-gradient(180deg, #fafafa 0%, #e8e7e2 100%);
    border: 1px solid var(--line);
    padding: 12px 22px;
    border-radius: 4px;
    cursor: pointer;
    transition: all .25s cubic-bezier(.2,.8,.2,1);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.8),
      0 2px 6px rgba(40,44,52,0.06);
    position: relative;
    overflow: hidden;
  }
  .tab::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.5) 50%, transparent 60%);
    transform: translateX(-100%);
    transition: transform .6s;
  }
  .tab:hover::before { transform: translateX(100%); }
  .tab:hover {
    color: var(--ink);
    border-color: var(--gold-deep);
    transform: translateY(-2px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.9),
      0 6px 14px rgba(40,44,52,0.12);
  }
  .tab.active {
    color: #fff;
    background: linear-gradient(180deg, #4a4a4a 0%, #2a2823 100%);
    border-color: var(--gold-deep);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.15),
      0 4px 14px rgba(40,44,52,0.25);
  }
  .tab .count {
    display: inline-block;
    margin-left: 8px;
    font-size: 10px;
    color: var(--gold-deep);
    font-weight: 700;
  }
  .tab.active .count { color: var(--gold-2); }

  /* Search row */
  .util-row {
    display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;
    padding: 0 24px;
    margin: 14px auto 0;
    max-width: 1100px;
  }
  .search-wrap { position: relative; }
  .search-wrap input {
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 10px 18px 10px 40px;
    border-radius: 999px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    width: 260px;
    outline: none;
    transition: all .2s;
    box-shadow: inset 0 1px 3px rgba(40,44,52,0.05);
  }
  .search-wrap input:focus { border-color: var(--gold-deep); background: #fff; width: 320px; }
  .search-wrap::before {
    content: '⌕'; position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
    color: var(--ink-soft); font-size: 18px; pointer-events: none;
  }
  .refresh-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 9px 18px;
    border-radius: 999px;
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all .2s;
  }
  .refresh-btn:hover { color: var(--ink); border-color: var(--gold-deep); }

  /* ─── SECTION ──────────────────────────────────────────────────────── */
  main { max-width: 1400px; margin: 0 auto; padding: 50px 32px 80px; }
  section.list { display: none; }
  section.list.active { display: block; animation: section-fade .6s ease; }
  @keyframes section-fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  .section-head {
    text-align: center;
    margin-bottom: 50px;
  }
  .section-head .eyebrow {
    font-family: 'Cinzel', serif;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 5px;
    color: var(--gold-deep);
    text-transform: uppercase;
  }
  .section-head h2 {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: clamp(28px, 4vw, 44px);
    letter-spacing: 3px;
    color: var(--ink);
    margin-top: 8px;
    background: linear-gradient(180deg, #3a3a3a 0%, #6f6f6f 70%, #4a4a4a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .section-head .divider {
    width: 240px;
    height: 1px;
    margin: 22px auto 0;
    background: linear-gradient(90deg, transparent, var(--gold-deep), transparent);
    position: relative;
  }
  .section-head .divider::after {
    content: '◆';
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: var(--bg);
    color: var(--gold-deep);
    font-size: 10px;
    padding: 0 12px;
  }

  /* ─── GRID + CARDS ─────────────────────────────────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 28px;
  }

  .card {
    position: relative;
    background: linear-gradient(180deg, #fcfbf8 0%, #ebe9e2 100%);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: var(--shadow-soft);
    transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s;
    opacity: 0;
    transform: translateY(18px);
  }
  .card.in-view { opacity: 1; transform: translateY(0); transition: opacity .6s, transform .6s; }
  .card:hover {
    transform: translateY(-6px) scale(1.02);
    box-shadow: var(--shadow-strong);
  }
  .card .cover {
    width: 100%;
    aspect-ratio: 2/3;
    background:
      linear-gradient(135deg, #f1efe8 0%, #d8d4ca 100%);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .card .cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .8s; }
  .card:hover .cover img { transform: scale(1.05); }
  .card .placeholder {
    text-align: center;
    padding: 16px;
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--ink-soft);
    background:
      radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), transparent 60%),
      radial-gradient(circle at 70% 80%, rgba(120,128,140,0.1), transparent 60%),
      linear-gradient(180deg, #f3f1ea, #d8d4ca);
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  .card .meta {
    padding: 16px 16px 18px;
    border-top: 1px solid rgba(58,62,72,0.08);
    background: linear-gradient(180deg, #fafaf6 0%, #efece5 100%);
  }
  .card .title {
    font-family: 'Cinzel', serif;
    font-weight: 500;
    font-size: 13.5px;
    letter-spacing: 1.5px;
    color: var(--ink);
    line-height: 1.4;
    text-align: center;
  }

  /* Rank badge - circular */
  .rank-badge {
    position: absolute; top: 12px; left: 12px; z-index: 3;
    width: 44px; height: 44px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    background: radial-gradient(circle at 35% 30%, #ffffff 0%, #e7e5dd 60%, #c8c5bb 100%);
    border: 1px solid rgba(58,62,72,0.18);
    box-shadow:
      inset 0 1px 2px rgba(255,255,255,0.9),
      inset 0 -2px 4px rgba(0,0,0,0.10),
      0 4px 10px rgba(40,44,52,0.18);
    text-shadow: 0 1px 0 rgba(255,255,255,0.6);
  }
  .rank-badge.gold {
    color: #5a3e10;
    background: radial-gradient(circle at 35% 25%, #fff4c4 0%, #e8c87b 35%, #c9a24c 70%, #8e6a23 100%);
    border: 1px solid #8e6a23;
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,0.85),
      inset 0 -3px 5px rgba(80,55,10,0.45),
      0 6px 14px rgba(180,140,40,0.45),
      0 0 22px rgba(232,200,123,0.35);
  }
  .rank-badge.silver {
    color: #383838;
    background: radial-gradient(circle at 35% 25%, #ffffff 0%, #e2e2e6 35%, #b6b6b9 70%, #6e6e74 100%);
    border: 1px solid #6e6e74;
    box-shadow:
      inset 0 2px 3px rgba(255,255,255,0.95),
      inset 0 -3px 5px rgba(50,50,60,0.45),
      0 6px 14px rgba(120,120,130,0.45),
      0 0 22px rgba(226,226,230,0.4);
  }
  .rank-badge.bronze {
    color: #3c1d05;
    background: radial-gradient(circle at 35% 25%, #ffe2c8 0%, #d9966a 35%, #b46a3a 70%, #6b3a18 100%);
    border: 1px solid #6b3a18;
    box-shadow:
      inset 0 2px 3px rgba(255,235,210,0.85),
      inset 0 -3px 5px rgba(60,30,5,0.45),
      0 6px 14px rgba(160,100,55,0.45),
      0 0 22px rgba(217,150,106,0.35);
  }

  /* Top 3 card framing */
  .card.tier-1, .card.tier-2, .card.tier-3 { padding: 3px; border: none; }
  .card.tier-1 { background: linear-gradient(135deg, #fff4c4 0%, #c9a24c 35%, #8e6a23 65%, #e8c87b 100%); background-size: 200% 200%; animation: shine 6s ease-in-out infinite; }
  .card.tier-2 { background: linear-gradient(135deg, #ffffff 0%, #b6b6b9 35%, #6e6e74 65%, #e2e2e6 100%); background-size: 200% 200%; animation: shine 6s ease-in-out infinite; }
  .card.tier-3 { background: linear-gradient(135deg, #ffe2c8 0%, #b46a3a 35%, #6b3a18 65%, #d9966a 100%); background-size: 200% 200%; animation: shine 6s ease-in-out infinite; }
  @keyframes shine {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .card.tier-1 > .inner, .card.tier-2 > .inner, .card.tier-3 > .inner {
    background: linear-gradient(180deg, #fcfbf8 0%, #ebe9e2 100%);
    border-radius: 8px;
    overflow: hidden;
  }
  .card.tier-1 { box-shadow: 0 14px 36px rgba(180,140,40,0.30), var(--shadow-soft); }
  .card.tier-2 { box-shadow: 0 14px 36px rgba(120,120,130,0.30), var(--shadow-soft); }
  .card.tier-3 { box-shadow: 0 14px 36px rgba(160,100,55,0.30), var(--shadow-soft); }
  .card.tier-1:hover { box-shadow: 0 22px 50px rgba(180,140,40,0.42), var(--shadow-strong); }
  .card.tier-2:hover { box-shadow: 0 22px 50px rgba(120,120,130,0.42), var(--shadow-strong); }
  .card.tier-3:hover { box-shadow: 0 22px 50px rgba(160,100,55,0.42), var(--shadow-strong); }

  /* ─── MODAL ────────────────────────────────────────────────────────── */
  .modal-wrap {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(40,44,52,0.55);
    backdrop-filter: blur(8px) saturate(120%);
    -webkit-backdrop-filter: blur(8px) saturate(120%);
    display: none;
    align-items: center; justify-content: center;
    padding: 32px;
  }
  .modal-wrap.open { display: flex; animation: fade-in .25s ease; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: linear-gradient(180deg, #fcfbf8 0%, #ebe9e2 100%);
    border: 1px solid var(--gold-deep);
    border-radius: 12px;
    padding: 36px;
    max-width: 540px;
    width: 100%;
    text-align: center;
    position: relative;
    box-shadow: var(--shadow-strong), 0 0 0 1px rgba(201,162,76,0.2);
    animation: modal-up .35s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes modal-up { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal img { max-height: 56vh; max-width: 100%; border-radius: 6px; box-shadow: var(--shadow-strong); }
  .modal .placeholder { width: 260px; height: 390px; margin: 0 auto; border-radius: 6px; }
  .modal h3 {
    font-family: 'Cinzel', serif;
    font-weight: 600;
    letter-spacing: 3px;
    margin-top: 24px;
    font-size: 20px;
    color: var(--ink);
  }
  .modal .modal-meta {
    color: var(--gold-deep);
    font-family: 'Cinzel', serif;
    font-size: 10px;
    margin-top: 8px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .modal .modal-link {
    display: inline-block;
    margin-top: 22px;
    padding: 10px 26px;
    border: 1px solid var(--ink);
    border-radius: 4px;
    color: var(--ink);
    text-decoration: none;
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 2px;
    transition: all .2s;
    background: linear-gradient(180deg, #fff 0%, #ebe9e2 100%);
  }
  .modal .modal-link:hover { background: var(--ink); color: #fff; }
  .modal .close {
    position: absolute; top: 12px; right: 16px;
    background: transparent; border: none; color: var(--ink-soft);
    font-size: 30px; cursor: pointer; line-height: 1;
    transition: color .2s;
  }
  .modal .close:hover { color: var(--ink); }

  /* ─── FOOTER ───────────────────────────────────────────────────────── */
  footer {
    text-align: center;
    padding: 30px 24px 50px;
    color: var(--muted);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    letter-spacing: 1px;
  }
  footer .ornament {
    margin: 0 12px;
    color: var(--gold-deep);
  }

  @media (max-width: 600px) {
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; }
    main { padding: 30px 16px 50px; }
    header.hero { padding: 50px 16px 20px; }
    .search-wrap input { width: 180px; }
    .search-wrap input:focus { width: 220px; }
    .tab { padding: 10px 16px; font-size: 11px; letter-spacing: 2px; }
    .rank-badge { width: 38px; height: 38px; font-size: 13px; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="brand-mark">★ ANNO MMXXVI ★</div>
  <h1>Aidan's <em>Recommendations</em></h1>
  <p class="subhead">A personal archive of the finest in literature, television, and cinema. <br/><span class="arrow">⌃</span> Choose a category below to explore my rankings <span class="arrow">⌃</span></p>
  <div class="laurel">
    <span class="line left"></span>
    <span class="line right"></span>
  </div>
</header>

<div class="tabs-wrap" id="tabs"></div>

<div class="util-row">
  <div class="search-wrap"><input id="search" type="text" placeholder="Search within category…" /></div>
  <button class="refresh-btn" id="refresh" title="Re-fetch cover art">↻ REFRESH COVERS</button>
</div>

<main id="main"></main>

<div class="modal-wrap" id="modal">
  <div class="modal">
    <button class="close" id="modal-close">×</button>
    <div id="modal-cover"></div>
    <h3 id="modal-title"></h3>
    <div class="modal-meta" id="modal-meta"></div>
    <a id="modal-link" class="modal-link" target="_blank" rel="noopener">Search on Google →</a>
  </div>
</div>

<footer>
  <span class="ornament">❦</span> Curated with care <span class="ornament">❦</span>
</footer>

<script>
// ─── DATA (exact order from Word doc) ─────────────────────────────────────
const DATA = {
  bookSeries: {
    label: 'Best Book Series',
    tabLabel: 'Books',
    type: 'book',
    items: [
      'Eragon + Murtagh',
      'Percy Jackson + Heroes of Olympus + Trials of Apollo + one-off books',
      'Fablehaven + Dragonwatch',
      'Stormlight Chronicles + Mistborn first trilogy',
      'Rangers Apprentice',
      'Hunger games + all the one-off books after it',
      'Kane Chronicles',
      'Harry Potter',
      'Magnus Chase books',
      'Divergent',
      'Maze runner',
    ],
  },
  tvSeries: {
    label: 'Best TV Series',
    tabLabel: 'TV Series',
    type: 'tv',
    items: [
      'Game of thrones',
      'Suits',
      'Curb your enthusiasm',
      'Landman',

// ─── COVER FETCH ──────────────────────────────────────────────────────────
const CACHE_PREFIX = 'cover:v2:';
function cacheKey(type, title) { return CACHE_PREFIX + type + ':' + title; }
function getCached(type, title) { try { return localStorage.getItem(cacheKey(type, title)); } catch(e) { return null; } }
function setCached(type, title, url) { try { localStorage.setItem(cacheKey(type, title), url || 'NONE'); } catch(e){} }

async function fetchTV(term) {
  try {
    const r = await fetch(`https://api.tvmaze.com/singlesearch/shows?q=${encodeURIComponent(term)}`);
    if (!r.ok) return null;
    const j = await r.json();
    return (j.image && (j.image.original || j.image.medium)) || null;
  } catch(e) { return null; }
}

async function fetchMovie(term) {
  try {
    const directGuesses = [
      term.replace(/ /g,'_') + '_(film)',
      term.replace(/ /g,'_'),
    ];
    for (const g of directGuesses) {
      const r = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(g)}`);
      if (!r.ok) continue;
      const j = await r.json();
      if (j.type === 'disambiguation') continue;
      const img = (j.originalimage && j.originalimage.source) || (j.thumbnail && j.thumbnail.source);
      if (img && /\.(jpe?g|png|gif|webp)$/i.test(img)) return img;
    }
    const sr = await fetch(`https://en.wikipedia.org/w/api.php?action=query&format=json&list=search&srsearch=${encodeURIComponent(term + ' film')}&srlimit=4&origin=*`);
    const sj = await sr.json();
    if (!sj.query || !sj.query.search.length) return null;
    for (const s of sj.query.search) {
      const r = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(s.title.replace(/ /g,'_'))}`);
      if (!r.ok) continue;
      const j = await r.json();
      if (j.type === 'disambiguation') continue;
      const img = (j.originalimage && j.originalimage.source) || (j.thumbnail && j.thumbnail.source);
      if (img && /\.(jpe?g|png|gif|webp)$/i.test(img)) return img;
    }
  } catch(e){}
  return null;
}

async function fetchBookCover(term) {
  try {
    const url = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(term)}&maxResults=1`;
    const r = await fetch(url);
    if (r.ok) {
      const j = await r.json();
      const links = j.items && j.items[0] && j.items[0].volumeInfo && j.items[0].volumeInfo.imageLinks;
      if (links) {
        let img = links.thumbnail || links.smallThumbnail;
        if (img) {
          img = img.replace('http://', 'https://').replace('&edge=curl','').replace('zoom=1','zoom=2');
          return img;
        }
      }
    }
  } catch(e){}
  try {
    const url2 = `https://openlibrary.org/search.json?q=${encodeURIComponent(term)}&limit=1`;
    const r2 = await fetch(url2);
    if (r2.ok) {
      const j2 = await r2.json();
      const doc = j2.docs && j2.docs[0];
      if (doc && doc.cover_i) return `https://covers.openlibrary.org/b/id/${doc.cover_i}-L.jpg`;
    }
  } catch(e){}
  return null;
}

async function lookupCover(type, title) {
  const cached = getCached(type, title);
  if (cached) return cached === 'NONE' ? null : cached;
  const term = SEARCH_OVERRIDES[type + ':' + title] || SEARCH_OVERRIDES[title] || title;
  let url = null;
  if (type === 'movie') url = await fetchMovie(term);
  else if (type === 'tv') url = await fetchTV(term);
  else if (type === 'book') url = await fetchBookCover(term);
  setCached(type, title, url);
  return url;
}

async function runWithLimit(items, fn, limit = 6) {
  const results = new Array(items.length);
  let idx = 0;
  async function worker() {
    while (idx < items.length) {
      const i = idx++;
      try { results[i] = await fn(items[i], i); }
      catch(e) { results[i] = null; }
    }
  }
  await Promise.all(Array.from({length: limit}, worker));
  return results;
}

// ─── RENDER ───────────────────────────────────────────────────────────────
const SECTION_ORDER = ['bookSeries', 'tvSeries', 'movies', 'movieSeries', 'booksToRead', 'tvToWatch', 'moviesToWatch'];
const SECTION_IDS = {
  bookSeries: 'book-series',
  tvSeries: 'tv-series',
  movies: 'movies',
  movieSeries: 'movie-series',
  booksToRead: 'books-watchlist',
  tvToWatch: 'tv-watchlist',
  moviesToWatch: 'movies-watchlist',
};

function tierClass(idx, isWatchlist) {
  if (isWatchlist) return '';
  if (idx === 0) return 'tier-1';
  if (idx === 1) return 'tier-2';
  if (idx === 2) return 'tier-3';
  return '';
}
function badgeClass(idx, isWatchlist) {
  if (isWatchlist) return '';
  if (idx === 0) return 'gold';
  if (idx === 1) return 'silver';
  if (idx === 2) return 'bronze';
  return '';
}

function buildCardEl(item, idx, type, isWatchlist) {
  const tier = tierClass(idx, isWatchlist);
  const badge = badgeClass(idx, isWatchlist);
  const card = document.createElement('div');
  card.className = 'card' + (tier ? ' ' + tier : '');
  card.dataset.title = item.toLowerCase();

  const inner = document.createElement('div');
  if (tier) inner.className = 'inner';

  const cover = document.createElement('div');
  cover.className = 'cover';
  const placeholder = document.createElement('div');
  placeholder.className = 'placeholder';
  placeholder.textContent = item.length > 32 ? item.slice(0, 30).toUpperCase() + '…' : item.toUpperCase();
  cover.appendChild(placeholder);

  const badgeEl = document.createElement('div');
  badgeEl.className = 'rank-badge' + (badge ? ' ' + badge : '');
  badgeEl.textContent = (idx + 1);
  cover.appendChild(badgeEl);

  const meta = document.createElement('div');
  meta.className = 'meta';
  const title = document.createElement('div');
  title.className = 'title';
  title.textContent = item;
  meta.appendChild(title);

  if (tier) {
    inner.appendChild(cover);
    inner.appendChild(meta);
    card.appendChild(inner);
  } else {
    card.appendChild(cover);
    card.appendChild(meta);
  }

  card.addEventListener('click', () => openModal(item, type, card._coverUrl));
  return { card, cover, placeholder };
}

function buildSection(key) {
  const sec = DATA[key];
  const el = document.createElement('section');
  el.className = 'list';
  el.id = SECTION_IDS[key];
  el.dataset.key = key;

  const head = document.createElement('div');
  head.className = 'section-head';
  head.innerHTML = `
    <div class="eyebrow">${sec.watchlist ? 'On the Horizon' : 'Ranked Best to Worst'}</div>
    <h2>${sec.label}</h2>
    <div class="divider"></div>
  `;
  el.appendChild(head);

  const grid = document.createElement('div');
  grid.className = 'grid';
  const builtCards = sec.items.map((item, idx) => {
    const built = buildCardEl(item, idx, sec.type, !!sec.watchlist);
    grid.appendChild(built.card);
    return built;
  });
  el.appendChild(grid);

  return { el, builtCards, key };
}

function attachIntersection(cards) {
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('in-view');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.05 });
  cards.forEach(({card}) => io.observe(card));
}

async function loadCovers(section) {
  await runWithLimit(section.builtCards, async (built, i) => {
    const item = DATA[section.key].items[i];
    const type = DATA[section.key].type;
    const url = await lookupCover(type, item);
    if (url) {
      built.card._coverUrl = url;
      const img = new Image();
      img.alt = item;
      img.onload = () => {
        // re-build cover preserving the badge
        const existingBadge = built.cover.querySelector('.rank-badge');
        built.cover.innerHTML = '';
        built.cover.appendChild(img);
        if (existingBadge) built.cover.appendChild(existingBadge);
      };
      img.onerror = () => {};
      img.src = url;
    }
  }, 6);
}

// ─── TABS ─────────────────────────────────────────────────────────────────
function buildTabs(sections) {
  const tabsEl = document.getElementById('tabs');
  sections.forEach((s, idx) => {
    const sec = DATA[s.key];
    const tab = document.createElement('button');
    tab.className = 'tab';
    tab.dataset.key = s.key;
    tab.innerHTML = `${sec.tabLabel}<span class="count">${sec.items.length}</span>`;
    tab.addEventListener('click', () => activateTab(s.key));
    tabsEl.appendChild(tab);
  });
}

function activateTab(key) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.key === key));
  document.querySelectorAll('section.list').forEach(s => s.classList.toggle('active', s.dataset.key === key));
  // Reset search filter
  const inp = document.getElementById('search');
  inp.value = '';
  document.querySelectorAll('.card').forEach(c => c.style.display = '');
  // Scroll into view
  window.scrollTo({ top: document.querySelector('.tabs-wrap').offsetTop - 20, behavior: 'smooth' });
  // update URL hash
  history.replaceState(null, '', '#' + SECTION_IDS[key]);
}

// ─── MODAL ────────────────────────────────────────────────────────────────
const modal = document.getElementById('modal');
const modalCover = document.getElementById('modal-cover');
const modalTitle = document.getElementById('modal-title');
const modalMeta  = document.getElementById('modal-meta');
const modalLink  = document.getElementById('modal-link');
document.getElementById('modal-close').addEventListener('click', closeModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

function openModal(title, type, coverUrl) {
  modalCover.innerHTML = '';
  if (coverUrl) {
    const img = document.createElement('img');
    img.src = coverUrl;
    img.alt = title;
    modalCover.appendChild(img);
  } else {
    const ph = document.createElement('div');
    ph.className = 'placeholder';
    ph.textContent = title.toUpperCase();
    modalCover.appendChild(ph);
  }
  modalTitle.textContent = title;
  modalMeta.textContent = type.toUpperCase();
  modalLink.href = 'https://www.google.com/search?q=' + encodeURIComponent(title + ' ' + type);
  modal.classList.add('open');
}
function closeModal() { modal.classList.remove('open'); }

// ─── SEARCH FILTER (within active tab) ────────────────────────────────────
const searchInput = document.getElementById('search');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim().toLowerCase();
  const activeSec = document.querySelector('section.list.active');
  if (!activeSec) return;
  activeSec.querySelectorAll('.card').forEach(c => {
    if (!q) c.style.display = '';
    else c.style.display = c.dataset.title.includes(q) ? '' : 'none';
  });
});

// ─── REFRESH ──────────────────────────────────────────────────────────────
document.getElementById('refresh').addEventListener('click', () => {
  if (!confirm('Clear cached covers and re-fetch?')) return;
  Object.keys(localStorage).filter(k => k.startsWith(CACHE_PREFIX)).forEach(k => localStorage.removeItem(k));
  location.reload();
});

// ─── BOOT ─────────────────────────────────────────────────────────────────
(function init() {
  const main = document.getElementById('main');
  const sections = SECTION_ORDER.map(buildSection);
  sections.forEach(s => main.appendChild(s.el));
  buildTabs(sections);
  attachIntersection(sections.flatMap(s => s.builtCards));
  sections.forEach(loadCovers);

  // Activate tab from URL hash or default
  const hash = (location.hash || '').replace('#','');
  const fromHash = SECTION_ORDER.find(k => SECTION_IDS[k] === hash);
  activateTab(fromHash || 'bookSeries');
})();
</script>
