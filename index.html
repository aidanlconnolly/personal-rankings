<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Aidan's Recommendations · Books · TV · Movies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef0f4;
    --bg-soft: #e3e6ed;
    --ink: #2a2823;
    --ink-soft: #6a6760;
    --muted: #9a978f;
    --gold: #c9a24c;
    --gold-2: #e8c87b;
    --gold-deep: #8e6a23;
    --silver: #b6b6b9;
    --silver-2: #e2e2e6;
    --silver-deep: #6e6e74;
    --bronze: #b46a3a;
    --bronze-2: #d9966a;
    --bronze-deep: #6b3a18;
    --line: rgba(58,62,72,0.18);
    --card-border: rgba(58,62,72,0.14);
    --shadow-soft: 0 12px 30px rgba(40,44,52,0.10), 0 2px 8px rgba(40,44,52,0.06);
    --shadow-strong: 0 28px 60px rgba(40,44,52,0.18), 0 8px 20px rgba(40,44,52,0.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { color: var(--ink); font-family: 'EB Garamond', 'Cormorant Garamond', Georgia, serif; min-height: 100vh; overflow-x: hidden; }
  body {
    background:
      radial-gradient(ellipse 90% 70% at 30% 0%, #ffffff 0%, transparent 55%),
      radial-gradient(ellipse 70% 50% at 80% 100%, #d8dbe2 0%, transparent 60%),
      linear-gradient(180deg, #eef0f4 0%, #d9dce3 100%);
    background-attachment: fixed;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='1200' viewBox='0 0 1200 1200'><defs><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.012' numOctaves='2' seed='9'/><feColorMatrix values='0 0 0 0 0.45  0 0 0 0 0.48  0 0 0 0 0.52  0 0 0 0.18 0'/></filter></defs><rect width='1200' height='1200' filter='url(%23n)'/></svg>");
    background-size: 800px 800px;
    opacity: 0.55;
    mix-blend-mode: multiply;
    pointer-events: none;
    z-index: -2;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 220px;
    background:
      linear-gradient(180deg, transparent, rgba(80,86,96,0.10)),
      repeating-linear-gradient(90deg,
        transparent 0px, transparent 80px,
        rgba(120,128,140,0.10) 80px, rgba(120,128,140,0.10) 84px,
        transparent 84px, transparent 164px,
        rgba(120,128,140,0.06) 164px, rgba(120,128,140,0.06) 256px);
    mask-image: linear-gradient(180deg, transparent 0%, black 80%);
    pointer-events: none;
    z-index: -1;
    opacity: 0.55;
  }

  /* ─── THEATRE CURTAINS BACKDROP ─────────────────────────────────────── */
  .curtain-bg {
    position: fixed; top: 0; left: 0; right: 0;
    height: 560px;
    z-index: -1;
    pointer-events: none;
    transition: opacity .15s linear;
    transform-origin: top center;
  }
  .curtain-bg .pelmet {
    /* The valance / pelmet at the very top */
    height: 70px;
    background:
      radial-gradient(ellipse 60% 100% at 50% 30%, #b51a26 0%, #7a0e18 70%, #44060c 100%),
      linear-gradient(180deg, #44060c, #7a0e18 60%, #4a0810);
    box-shadow:
      inset 0 -8px 18px rgba(0,0,0,0.5),
      0 6px 18px rgba(0,0,0,0.35);
    border-bottom: 3px solid #2a0408;
    position: relative;
  }
  .curtain-bg .pelmet::after {
    /* hanging tassel ornaments */
    content: '';
    position: absolute;
    bottom: -16px; left: 0; right: 0;
    height: 18px;
    background:
      radial-gradient(circle 9px at 32px 0px, #d4af37 0%, #8e6a23 70%, transparent 72%),
      radial-gradient(circle 9px at 32px 0px, #d4af37 0%, #8e6a23 70%, transparent 72%);
    background-image:
      repeating-radial-gradient(circle 9px at 32px 0px, #d4af37 0 6px, #8e6a23 6px 9px, transparent 9px);
    background-size: 64px 18px;
    background-repeat: repeat-x;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,0.4));
  }
  .curtain-bg .curtain {
    position: absolute;
    top: 70px;
    width: 50%;
    height: calc(100% - 70px);
    background:
      /* vertical pleats / folds with darker shadows for depth */
      repeating-linear-gradient(90deg,
        rgba(0,0,0,0.55) 0px,
        rgba(0,0,0,0.0) 16px,
        rgba(255,255,255,0.10) 30px,
        rgba(0,0,0,0.0) 44px,
        rgba(0,0,0,0.55) 60px),
      linear-gradient(180deg, #6a050d 0%, #a01018 25%, #8a0c15 55%, #54050b 100%);
    box-shadow: inset 0 -60px 100px rgba(0,0,0,0.55), inset 0 0 80px rgba(0,0,0,0.35);
  }
  .curtain-bg .curtain.left {
    left: 0;
    transform-origin: top right;
    animation: curtain-sway-left 6s ease-in-out infinite;
    border-right: 2px solid rgba(0,0,0,0.4);
  }
  .curtain-bg .curtain.right {
    right: 0;
    transform-origin: top left;
    animation: curtain-sway-right 6.5s ease-in-out infinite;
    border-left: 2px solid rgba(0,0,0,0.4);
  }
  .curtain-bg .center-shadow {
    /* darker seam where curtains meet, behind the title text */
    position: absolute;
    top: 70px; left: 50%; transform: translateX(-50%);
    width: 14%; height: calc(100% - 70px);
    background: radial-gradient(ellipse 100% 80% at 50% 30%, rgba(0,0,0,0.45) 0%, transparent 70%);
    z-index: 1;
  }
  @keyframes curtain-sway-left {
    0%, 100% { transform: skewX(0deg) translateX(0); }
    50%      { transform: skewX(0.6deg) translateX(-3px); }
  }
  @keyframes curtain-sway-right {
    0%, 100% { transform: skewX(0deg) translateX(0); }
    50%      { transform: skewX(-0.6deg) translateX(3px); }
  }

  /* ─── HERO ──────────────────────────────────────────────────────────── */
  header.hero { text-align: center; padding: 100px 24px 40px; position: relative; z-index: 1; }
  header.hero h1 {
    font-family: 'Playfair Display', 'EB Garamond', Georgia, serif;
    font-weight: 800;
    font-size: clamp(36px, 5.5vw, 70px);
    letter-spacing: 2px;
    line-height: 1.1;
    color: #fff7e2;
    text-shadow:
      0 2px 0 rgba(0,0,0,0.35),
      0 6px 24px rgba(0,0,0,0.6),
      0 0 40px rgba(212,175,55,0.35);
  }
  header.hero h1 em {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 700;
    color: #f3d985;
    background: linear-gradient(180deg, #ffefb5 0%, #d4af37 50%, #8e6a23 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
  }
  header.hero .subhead {
    margin-top: 22px;
    font-family: 'EB Garamond', 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(16px, 1.6vw, 20px);
    color: #f4e8d0;
    max-width: 640px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.5;
    text-shadow: 0 1px 6px rgba(0,0,0,0.55);
  }
  header.hero .subhead .arrow { color: #f3d985; margin: 0 6px; }
  header.hero .laurel {
    width: 180px; height: 28px;
    margin: 28px auto 0;
    position: relative;
  }
  header.hero .laurel::before { content: '⚜'; position: absolute; left: 50%; top: 0; transform: translateX(-50%); font-size: 18px; color: var(--gold-deep); opacity: 0.7; }
  header.hero .laurel > .line { position: absolute; top: 50%; height: 1px; width: 60px;
    background: linear-gradient(90deg, transparent, var(--gold-deep), transparent); }
  header.hero .laurel > .line.left { left: 0; }
  header.hero .laurel > .line.right { right: 0; }

  /* ─── TABS ──────────────────────────────────────────────────────────── */
  .tabs-wrap {
    display: flex; justify-content: center; flex-wrap: wrap;
    gap: 10px;
    padding: 0 24px;
    margin: 36px auto 8px;
    max-width: 1100px;
  }
  .tab {
    font-family: 'Playfair Display', 'EB Garamond', Georgia, serif;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: linear-gradient(180deg, #fafafa 0%, #e8e7e2 100%);
    border: 1px solid var(--line);
    padding: 12px 22px;
    border-radius: 4px;
    cursor: pointer;
    transition: all .25s cubic-bezier(.2,.8,.2,1);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 2px 6px rgba(40,44,52,0.06);
    position: relative;
    overflow: hidden;
  }
  .tab::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.5) 50%, transparent 60%);
    transform: translateX(-100%);
    transition: transform .6s;
  }
  .tab:hover::before { transform: translateX(100%); }
  .tab:hover {
    color: var(--ink);
    border-color: var(--gold-deep);
    transform: translateY(-2px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 6px 14px rgba(40,44,52,0.12);
  }
  .tab.active {
    color: #fff;
    background: linear-gradient(180deg, #4a4a4a 0%, #2a2823 100%);
    border-color: var(--gold-deep);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 4px 14px rgba(40,44,52,0.25);
  }
  .tab .count {
    display: inline-block;
    margin-left: 8px;
    font-size: 10px;
    color: var(--gold-deep);
    font-weight: 700;
  }
  .tab.active .count { color: var(--gold-2); }

  /* ─── SUB-TABS (segmented control: main list ⇄ want-to-watch) ─────── */
  .subtabs-wrap {
    display: flex; justify-content: center;
    margin: 18px auto 0;
    padding: 0 24px;
  }
  .subtabs-wrap.hidden { display: none; }
  .subtabs {
    display: inline-flex;
    background: rgba(255,255,255,0.55);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
    box-shadow: inset 0 1px 2px rgba(40,44,52,0.06);
  }
  .subtab {
    font-family: 'Playfair Display', 'EB Garamond', Georgia, serif;
    font-size: 10.5px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    padding: 8px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .25s ease;
    white-space: nowrap;
  }
  .subtab:hover { color: var(--ink); }
  .subtab.active {
    color: #fff;
    background: linear-gradient(180deg, var(--gold) 0%, var(--gold-deep) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 2px 8px rgba(142,106,35,0.4);
  }
  .subtab .arrow { margin-left: 6px; font-size: 10px; opacity: 0.7; }

  /* ─── FILTER CHIPS ──────────────────────────────────────────────────── */
  .filters-wrap {
    max-width: 1200px;
    margin: 28px auto 0;
    padding: 0 24px;
    text-align: center;
  }
  .filters-label {
    font-family: 'Playfair Display', 'EB Garamond', Georgia, serif;
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--ink-soft);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .filters-label .clear {
    margin-left: 14px;
    background: transparent;
    border: none;
    color: var(--gold-deep);
    font-family: 'Playfair Display', 'EB Garamond', Georgia, serif;
    font-size: 10px;
    letter-spacing: 2px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    display: none;
  }
  .filters-label .clear.visible { display: inline-block; }
  .filter-chips {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 7px;
    max-width: 1000px;
    margin: 0 auto;
  }
  .chip {
    font-family: 'Playfair Display', 'EB Garamond', Georgia, serif;
    font-size: 10.5px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ink-soft);
    background: rgba(255,255,255,0.6);
    border: 1px solid var(--line);
    padding: 6px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .2s;
    user-select: none;
  }
  .chip:hover {
    color: var(--ink);
    border-color: var(--gold-deep);
    background: rgba(255,255,255,0.9);
  }
  .chip.active {
    color: #fff;
    background: linear-gradient(180deg, var(--gold) 0%, var(--gold-deep) 100%);
    border-color: var(--gold-deep);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.3), 0 2px 8px rgba(142,106,35,0.4);
  }
  .chip.active::after { content: ' ✓'; font-size: 10px; }

  /* ─── MAIN ─────────────────────────────────────────────────────────── */
  main { max-width: 1400px; margin: 0 auto; padding: 30px 32px 80px; }
  section.list { display: none; }
  section.list.active { display: block; animation: section-fade .5s ease; }
  /* Watchlist now opens via sub-tab, not stacked under primary */
  @keyframes section-fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  .section-head { text-align: center; margin-bottom: 40px; padding-top: 30px; }
  .section-head .eyebrow {
    font-family: 'Playfair Display', 'EB Garamond', Georgia, serif;
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 5px;
    color: var(--gold-deep);
    text-transform: uppercase;
  }
  .section-head h2 {
    font-family: 'Playfair Display', 'EB Garamond', Georgia, serif;
    font-weight: 600;
    font-size: clamp(28px, 4vw, 44px);
    letter-spacing: 3px;
    color: var(--ink);
    margin-top: 8px;
    background: linear-gradient(180deg, #3a3a3a 0%, #6f6f6f 70%, #4a4a4a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .section-head .divider {
    width: 240px; height: 1px;
    margin: 22px auto 0;
    background: linear-gradient(90deg, transparent, var(--gold-deep), transparent);
    position: relative;
  }
  .section-head .divider::after {
    content: '◆';
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: var(--bg);
    color: var(--gold-deep);
    font-size: 10px;
    padding: 0 12px;
  }

  /* ─── GRID + CARDS ─────────────────────────────────────────────────── */
  .grid {
    display: grid;
    gap: 28px 24px;
    position: relative;
    padding: 20px 8px 80px;
    align-items: start;
  }

  .card {
    position: relative;
    background: linear-gradient(180deg, #fcfbf8 0%, #ebe9e2 100%);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: var(--shadow-soft);
    transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s, opacity .35s;
    opacity: 0;
  }
  .card.in-view { opacity: 1; transition: opacity .6s ease; }
  .card.hidden-by-filter { display: none !important; }
  .card:hover {
    transform: translateY(-8px) scale(1.025);
    box-shadow: var(--shadow-strong);
    z-index: 4;
  }
  /* Title block ABOVE the poster (also hosts the rank badge in its top-left) */
  .card .title-strip {
    position: relative;
    background: linear-gradient(180deg, #2a2823 0%, #3a3530 100%);
    color: #ffffff;
    padding: 16px 40px 16px 60px;
    font-family: 'Playfair Display', 'EB Garamond', Georgia, serif;
    font-weight: 500;
    font-size: 12.5px;
    letter-spacing: 1.5px;
    text-align: center;
    line-height: 1.3;
    min-height: 64px;
    display: flex; align-items: center; justify-content: center;
    border-bottom: 2px solid var(--gold-deep);
    text-shadow: 0 1px 0 rgba(0,0,0,0.5);
  }
  .card .title-strip.long { font-size: 10.5px; letter-spacing: 1px; min-height: 78px; padding: 14px 38px 14px 56px; }
  .card .title-strip.very-long { font-size: 9.5px; letter-spacing: 0.5px; min-height: 92px; padding: 12px 36px 12px 52px; line-height: 1.35; }

  /* Save / bookmark button in the top-right of the title strip */
  .save-btn {
    position: absolute; top: 50%; right: 8px;
    transform: translateY(-50%);
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.06);
    color: #f4e8d0;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    line-height: 1;
    transition: all .2s;
    z-index: 4;
    padding: 0;
  }
  .save-btn:hover {
    background: rgba(212,175,55,0.18);
    border-color: var(--gold-2);
    color: var(--gold-2);
    transform: translateY(-50%) scale(1.1);
  }
  .save-btn.saved {
    background: linear-gradient(180deg, var(--gold-2) 0%, var(--gold-deep) 100%);
    color: #2a1d05;
    border-color: var(--gold-deep);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 2px 6px rgba(142,106,35,0.5);
  }

  /* Saved tab special styling */
  .tab.saved-tab .count {
    background: linear-gradient(180deg, var(--gold-2) 0%, var(--gold-deep) 100%);
    color: #2a1d05;
    padding: 2px 7px;
    border-radius: 999px;
    font-size: 9px;
    margin-left: 8px;
  }
  .tab.saved-tab.active .count { background: rgba(255,255,255,0.2); color: #fff; }

  /* Saved view sub-sections */
  section.saved-view { padding-top: 30px; }
  section.saved-view .saved-group { margin-bottom: 60px; }
  section.saved-view .saved-group-title {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-style: italic;
    font-size: 28px;
    color: var(--ink);
    text-align: center;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  section.saved-view .saved-group-divider {
    width: 180px; height: 1px;
    margin: 8px auto 32px;
    background: linear-gradient(90deg, transparent, var(--gold-deep), transparent);
  }
  section.saved-view .saved-empty {
    text-align: center;
    color: var(--ink-soft);
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 18px;
    padding: 80px 24px;
  }
  section.saved-view .saved-empty .hint {
    margin-top: 10px;
    font-size: 14px;
    color: var(--muted);
  }
  section.saved-view .empty-group {
    text-align: center;
    color: var(--muted);
    font-style: italic;
    padding: 20px;
  }
  .card .cover {
    width: 100%;
    aspect-ratio: 2/3;
    background: linear-gradient(135deg, #f1efe8 0%, #d8d4ca 100%);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .card .cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .8s; }
  .card:hover .cover img { transform: scale(1.06); }
  .card .placeholder {
    text-align: center;
    padding: 16px;
    font-family: 'Playfair Display', 'EB Garamond', Georgia, serif;
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--ink-soft);
    background:
      radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), transparent 60%),
      radial-gradient(circle at 70% 80%, rgba(120,128,140,0.1), transparent 60%),
      linear-gradient(180deg, #f3f1ea, #d8d4ca);
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }

  /* Rank badge - circular, now sits in the top-left of the title strip */
  .rank-badge {
    position: absolute; top: 50%; left: 10px;
    transform: translateY(-50%);
    z-index: 3;
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Playfair Display', 'EB Garamond', Georgia, serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--ink);
    background: radial-gradient(circle at 35% 30%, #ffffff 0%, #e7e5dd 60%, #c8c5bb 100%);
    border: 1px solid rgba(58,62,72,0.35);
    box-shadow: inset 0 1px 2px rgba(255,255,255,0.9), inset 0 -2px 4px rgba(0,0,0,0.10), 0 3px 8px rgba(0,0,0,0.35);
    text-shadow: 0 1px 0 rgba(255,255,255,0.6);
  }
  .rank-badge.gold {
    color: #5a3e10;
    background: radial-gradient(circle at 35% 25%, #fff4c4 0%, #e8c87b 35%, #c9a24c 70%, #8e6a23 100%);
    border: 1px solid #8e6a23;
    box-shadow: inset 0 2px 3px rgba(255,255,255,0.85), inset 0 -3px 5px rgba(80,55,10,0.45), 0 6px 14px rgba(180,140,40,0.45), 0 0 22px rgba(232,200,123,0.35);
  }
  .rank-badge.silver {
    color: #383838;
    background: radial-gradient(circle at 35% 25%, #ffffff 0%, #e2e2e6 35%, #b6b6b9 70%, #6e6e74 100%);
    border: 1px solid #6e6e74;
    box-shadow: inset 0 2px 3px rgba(255,255,255,0.95), inset 0 -3px 5px rgba(50,50,60,0.45), 0 6px 14px rgba(120,120,130,0.45), 0 0 22px rgba(226,226,230,0.4);
  }

// ─── SAVED ITEMS (localStorage-backed personal list, split by tab) ────────
const SAVED_KEY = 'saved:v1';
// id format: `${tabKey}::${section}::${title}` so duplicates across sections (Percy Jackson etc.) stay distinct
function makeSavedId(tabKey, sectionKey, title) { return tabKey + '::' + sectionKey + '::' + title; }

function loadSaved() {
  try {
    const raw = localStorage.getItem(SAVED_KEY);
    if (!raw) return { movies: [], books: [], tv: [], movieSeries: [] };
    const parsed = JSON.parse(raw);
    return { movies: [], books: [], tv: [], movieSeries: [], ...parsed };
  } catch(e) { return { movies: [], books: [], tv: [], movieSeries: [] }; }
}
function saveSaved(state) {
  try { localStorage.setItem(SAVED_KEY, JSON.stringify(state)); } catch(e){}
}
let SAVED = loadSaved();

function isSaved(tabKey, id) { return (SAVED[tabKey] || []).includes(id); }
function toggleSaved(tabKey, id) {
  const list = SAVED[tabKey] || (SAVED[tabKey] = []);
  const i = list.indexOf(id);
  if (i === -1) list.push(id); else list.splice(i, 1);
  saveSaved(SAVED);
  refreshSavedCount();
  // If currently viewing the Saved tab, re-render it so removed items disappear
  if (document.querySelector('.tab.active')?.dataset.key === 'saved') renderSavedView();
}
function savedCount() { return Object.values(SAVED).reduce((s, arr) => s + arr.length, 0); }

// ─── COVER FETCH ──────────────────────────────────────────────────────────
const CACHE_PREFIX = 'cover:v2:';
function cacheKey(type, title) { return CACHE_PREFIX + type + ':' + title; }
function getCached(type, title) { try { return localStorage.getItem(cacheKey(type, title)); } catch(e) { return null; } }
function setCached(type, title, url) { try { localStorage.setItem(cacheKey(type, title), url || 'NONE'); } catch(e){} }

async function fetchTV(term) {
  try {
    const r = await fetch(`https://api.tvmaze.com/singlesearch/shows?q=${encodeURIComponent(term)}`);
    if (!r.ok) return null;
    const j = await r.json();
    return (j.image && (j.image.original || j.image.medium)) || null;
  } catch(e) { return null; }
}

async function fetchMovie(term) {
  try {
    const directGuesses = [
      term.replace(/ /g,'_') + '_(film)',
      term.replace(/ /g,'_'),
    ];
    for (const g of directGuesses) {
      const r = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(g)}`);
      if (!r.ok) continue;
      const j = await r.json();
      if (j.type === 'disambiguation') continue;
      const img = (j.originalimage && j.originalimage.source) || (j.thumbnail && j.thumbnail.source);
      if (img && /\.(jpe?g|png|gif|webp)$/i.test(img)) return img;
    }
    const sr = await fetch(`https://en.wikipedia.org/w/api.php?action=query&format=json&list=search&srsearch=${encodeURIComponent(term + ' film')}&srlimit=4&origin=*`);
    const sj = await sr.json();
    if (!sj.query || !sj.query.search.length) return null;
    for (const s of sj.query.search) {
      const r = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(s.title.replace(/ /g,'_'))}`);
      if (!r.ok) continue;
      const j = await r.json();
      if (j.type === 'disambiguation') continue;
      const img = (j.originalimage && j.originalimage.source) || (j.thumbnail && j.thumbnail.source);
      if (img && /\.(jpe?g|png|gif|webp)$/i.test(img)) return img;
    }
  } catch(e){}
  return null;
}

async function fetchBookCover(term) {
  try {
    const url = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(term)}&maxResults=1`;
    const r = await fetch(url);
    if (r.ok) {
      const j = await r.json();
      const links = j.items && j.items[0] && j.items[0].volumeInfo && j.items[0].volumeInfo.imageLinks;
      if (links) {
        let img = links.thumbnail || links.smallThumbnail;
        if (img) {
          img = img.replace('http://', 'https://').replace('&edge=curl','').replace('zoom=1','zoom=2');
          return img;
        }
      }
    }
  } catch(e){}
  try {
    const url2 = `https://openlibrary.org/search.json?q=${encodeURIComponent(term)}&limit=1`;
    const r2 = await fetch(url2);
    if (r2.ok) {
      const j2 = await r2.json();
      const doc = j2.docs && j2.docs[0];
      if (doc && doc.cover_i) return `https://covers.openlibrary.org/b/id/${doc.cover_i}-L.jpg`;
    }
  } catch(e){}
  return null;
}

async function lookupCover(type, title) {
  const cached = getCached(type, title);
  if (cached) return cached === 'NONE' ? null : cached;
  const term = SEARCH_OVERRIDES[type + ':' + title] || SEARCH_OVERRIDES[title] || title;
  let url = null;
  if (type === 'movie') url = await fetchMovie(term);
  else if (type === 'tv') url = await fetchTV(term);
  else if (type === 'book') url = await fetchBookCover(term);
  setCached(type, title, url);
  return url;
}

async function runWithLimit(items, fn, limit = 6) {
  const results = new Array(items.length);
  let idx = 0;
  async function worker() {
    while (idx < items.length) {
      const i = idx++;
      try { results[i] = await fn(items[i], i); }
      catch(e) { results[i] = null; }
    }
  }
  await Promise.all(Array.from({length: limit}, worker));
  return results;
}

// ─── RENDER ───────────────────────────────────────────────────────────────
const SECTION_KEYS = ['bookSeries', 'tvSeries', 'movies', 'movieSeries', 'booksToRead', 'tvToWatch', 'moviesToWatch'];
const SECTION_IDS = {
  bookSeries: 'book-series',
  tvSeries: 'tv-series',
  movies: 'movies',
  movieSeries: 'movie-series',
  booksToRead: 'books-watchlist',
  tvToWatch: 'tv-watchlist',
  moviesToWatch: 'movies-watchlist',
};

function tierClass(idx, isWatchlist) {
  if (isWatchlist) return '';
  if (idx === 0) return 'tier-1';
  if (idx === 1) return 'tier-2';
  if (idx === 2) return 'tier-3';
  return '';
}
function badgeClass(idx, isWatchlist) {
  if (isWatchlist) return '';
  if (idx === 0) return 'gold';
  if (idx === 1) return 'silver';
  if (idx === 2) return 'bronze';
  return '';
}

function buildCardEl(item, idx, type, isWatchlist, sectionKey) {
  const tier = tierClass(idx, isWatchlist);
  const badge = badgeClass(idx, isWatchlist);
  const card = document.createElement('div');
  card.className = 'card' + (tier ? ' ' + tier : '');
  card.dataset.title = item.title.toLowerCase();
  card.dataset.tags = item.tags.map(t => t.toLowerCase()).join('|');

  const tabKey = SECTION_TO_TAB[sectionKey];
  const savedId = makeSavedId(tabKey, sectionKey, item.title);

  const inner = document.createElement('div');
  if (tier) inner.className = 'inner';
  const host = tier ? inner : card;

  // Title block ABOVE the poster (badge in top-left, save button in top-right)
  const titleStrip = document.createElement('div');
  let stripClass = 'title-strip';
  if (item.title.length > 48) stripClass += ' very-long';
  else if (item.title.length > 26) stripClass += ' long';
  titleStrip.className = stripClass;

  const badgeEl = document.createElement('div');
  badgeEl.className = 'rank-badge' + (badge ? ' ' + badge : '');
  badgeEl.textContent = (idx + 1);
  titleStrip.appendChild(badgeEl);

  const titleText = document.createElement('span');
  titleText.className = 'title-text';
  titleText.textContent = item.title;
  titleStrip.appendChild(titleText);

  const saveBtn = document.createElement('button');
  saveBtn.className = 'save-btn' + (isSaved(tabKey, savedId) ? ' saved' : '');
  saveBtn.title = 'Save to my list';
  saveBtn.innerHTML = '★';
  saveBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    toggleSaved(tabKey, savedId);
    saveBtn.classList.toggle('saved');
  });
  titleStrip.appendChild(saveBtn);

  host.appendChild(titleStrip);

  // Cover
  const cover = document.createElement('div');
  cover.className = 'cover';
  const placeholder = document.createElement('div');
  placeholder.className = 'placeholder';
  placeholder.textContent = item.title.length > 32 ? item.title.slice(0, 30).toUpperCase() + '…' : item.title.toUpperCase();
  cover.appendChild(placeholder);

  host.appendChild(cover);
  if (tier) card.appendChild(inner);

  card.addEventListener('click', () => openModal(item, type, card._coverUrl));
  return { card, cover, placeholder, item, savedId, tabKey, sectionKey };
}

function buildSection(key) {
  const sec = DATA[key];
  const el = document.createElement('section');
  el.className = 'list';
  el.id = SECTION_IDS[key];
  el.dataset.key = key;

  const head = document.createElement('div');
  head.className = 'section-head';
  head.innerHTML = `
    <div class="eyebrow">${sec.watchlist ? 'On the Horizon' : 'Ranked Best to Worst'}</div>
    <h2>${sec.label}</h2>
    <div class="divider"></div>
  `;
  el.appendChild(head);

  const grid = document.createElement('div');
  grid.className = 'grid';
  const builtCards = sec.items.map((item, idx) => {
    const built = buildCardEl(item, idx, sec.type, !!sec.watchlist, key);
    grid.appendChild(built.card);
    return built;
  });
  el.appendChild(grid);

  return { el, builtCards, key };
}

// reverse lookup: section key → its parent tab key
const SECTION_TO_TAB = {};
TABS.forEach(t => t.sections.forEach(sk => { SECTION_TO_TAB[sk] = t.key; }));

function attachIntersection(cards) {
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('in-view');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.05 });
  cards.forEach(({card}) => io.observe(card));
}

async function loadCovers(section) {
  await runWithLimit(section.builtCards, async (built, i) => {
    const item = built.item;
    const type = DATA[section.key].type;
    const url = await lookupCover(type, item.title);
    if (url) {
      built.card._coverUrl = url;
      const img = new Image();
      img.alt = item.title;
      img.onload = () => {
        built.cover.innerHTML = '';
        built.cover.appendChild(img);
      };
      img.onerror = () => {};
      img.src = url;
    }
  }, 6);
}

// ─── ZIGZAG / ROADMAP LAYOUT ──────────────────────────────────────────────
function colsForViewport() {
  const w = window.innerWidth;
  if (w >= 1280) return 5;
  if (w >= 960) return 4;
  if (w >= 640) return 3;
  return 2;
}

function applyZigzag(grid) {
  const cols = colsForViewport();
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  // 2-col mobile gets a much smaller stagger so the second card isn't drastically lower
  const stagger = cols <= 2
    ? Math.max(16, Math.min(36, Math.round(window.innerWidth / 14)))
    : Math.max(56, Math.min(112, Math.round(window.innerWidth / 20)));
  // Only consider visible (not filter-hidden) cards for layout
  const visibleCards = [...grid.children].filter(c => !c.classList.contains('hidden-by-filter'));
  // Reset positions on hidden cards
  [...grid.children].forEach(c => {
    if (c.classList.contains('hidden-by-filter')) {
      c.style.gridColumn = ''; c.style.gridRow = ''; c.style.marginTop = '';
    }
  });
  visibleCards.forEach((card, idx) => {
    const row = Math.floor(idx / cols);
    const colInRow = idx % cols;
    const visualCol = row % 2 === 0 ? colInRow : (cols - 1 - colInRow);
    card.style.gridColumn = (visualCol + 1) + '';
    card.style.gridRow = (row + 1) + '';
    card.style.marginTop = (colInRow * stagger) + 'px';
  });
}

let _zigzagTimer = null;
function applyZigzagAll() {
  document.querySelectorAll('.grid').forEach(applyZigzag);
}
window.addEventListener('resize', () => {
  clearTimeout(_zigzagTimer);
  _zigzagTimer = setTimeout(applyZigzagAll, 120);
});

// ─── FILTER (multi-select genre chips) ────────────────────────────────────
const activeFilters = new Set();
const chipsEl = document.getElementById('filter-chips');
const clearBtn = document.getElementById('clear-filters');

function tagsForSection(sectionKey) {
  const sec = DATA[sectionKey];
  if (!sec) return [];
  const tagSet = new Set();
  sec.items.forEach(it => it.tags.forEach(t => tagSet.add(t)));
  return [...tagSet].sort((a,b) => a.localeCompare(b));
}

function rebuildFilterChips(_tabKey, sectionKey) {
  chipsEl.innerHTML = '';
  activeFilters.clear();
  updateClearBtnVisibility();
  const tags = tagsForSection(sectionKey);
  tags.forEach(tag => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.dataset.tag = tag.toLowerCase();
    chip.textContent = tag;
    chip.addEventListener('click', () => {
      if (activeFilters.has(chip.dataset.tag)) {
        activeFilters.delete(chip.dataset.tag);
        chip.classList.remove('active');
      } else {
        activeFilters.add(chip.dataset.tag);
        chip.classList.add('active');
      }
      updateClearBtnVisibility();
      applyFilter();
    });
    chipsEl.appendChild(chip);
  });
}

function updateClearBtnVisibility() {
  clearBtn.classList.toggle('visible', activeFilters.size > 0);
}

clearBtn.addEventListener('click', () => {
  activeFilters.clear();
  chipsEl.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  updateClearBtnVisibility();
  applyFilter();
});

function applyFilter() {
  document.querySelectorAll('section.list.active .card').forEach(card => {
    if (activeFilters.size === 0) {
      card.classList.remove('hidden-by-filter');
    } else {
      const cardTags = (card.dataset.tags || '').split('|');
      const matches = cardTags.some(t => activeFilters.has(t));
      card.classList.toggle('hidden-by-filter', !matches);
    }
  });
  applyZigzagAll();
}

// ─── TABS ─────────────────────────────────────────────────────────────────
// `subviewPerTab` tracks which section index within a tab is currently shown.
// 0 = primary ranked list, 1 = watchlist (if it exists)
const subviewPerTab = { books: 0, tv: 0, movies: 0, movieSeries: 0 };

function buildTabs() {
  const tabsEl = document.getElementById('tabs');
  TABS.forEach((tabDef) => {
    // Count = primary section only (watchlist is its own sub-view now)
    const primaryCount = DATA[tabDef.sections[0]].items.length;
    const tab = document.createElement('button');
    tab.className = 'tab';
    tab.dataset.key = tabDef.key;
    tab.innerHTML = `${tabDef.label}<span class="count">${primaryCount}</span>`;
    tab.addEventListener('click', () => activateTab(tabDef.key));
    tabsEl.appendChild(tab);
  });
  // "My Saved" tab
  const savedTab = document.createElement('button');
  savedTab.className = 'tab saved-tab';
  savedTab.dataset.key = 'saved';
  savedTab.innerHTML = `★ My Saved<span class="count" id="saved-count">${savedCount()}</span>`;
  savedTab.addEventListener('click', () => activateTab('saved'));
  tabsEl.appendChild(savedTab);
}

function refreshSavedCount() {
  const el = document.getElementById('saved-count');
  if (el) el.textContent = savedCount();
}

function rebuildSubtabs(tabDef, activeSubIdx) {
  const wrap = document.getElementById('subtabs-wrap');
  const inner = document.getElementById('subtabs');
  inner.innerHTML = '';
  if (tabDef.sections.length < 2) {
    wrap.classList.add('hidden');
    return;
  }
  wrap.classList.remove('hidden');
  tabDef.sections.forEach((sk, idx) => {
    const isWatchlist = !!DATA[sk].watchlist;
    const label = !isWatchlist
      ? '★ Top Picks'
      : (DATA[sk].type === 'book' ? 'Want to Read →' : 'Want to Watch →');
    const btn = document.createElement('button');
    btn.className = 'subtab' + (idx === activeSubIdx ? ' active' : '');
    btn.textContent = label;
    btn.addEventListener('click', () => activateTab(tabDef.key, idx));
    inner.appendChild(btn);
  });
}

function activateTab(key, subIdx) {
  // ── Special: the "Saved" tab is not in TABS; render its own view ──
  if (key === 'saved') {
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.key === 'saved'));
    document.querySelectorAll('section.list').forEach(s => s.classList.remove('active'));
    document.getElementById('saved-view').classList.add('active');
    document.getElementById('subtabs-wrap').classList.add('hidden');
    document.getElementById('filters-wrap').style.display = 'none';
    renderSavedView();
    window.scrollTo({ top: document.querySelector('.tabs-wrap').offsetTop - 20, behavior: 'smooth' });
    history.replaceState(null, '', '#saved');
    return;
  }
  document.getElementById('saved-view').classList.remove('active');
  document.getElementById('filters-wrap').style.display = '';

  const tabDef = TABS.find(t => t.key === key);
  if (!tabDef) return;
  if (typeof subIdx !== 'number') subIdx = subviewPerTab[key] || 0;
  if (subIdx >= tabDef.sections.length) subIdx = 0;
  subviewPerTab[key] = subIdx;
  const sectionKey = tabDef.sections[subIdx];

  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.key === key));
  document.querySelectorAll('section.list').forEach(s => {
    s.classList.toggle('active', s.dataset.key === sectionKey);
  });
  rebuildSubtabs(tabDef, subIdx);
  rebuildFilterChips(key, sectionKey);
  applyZigzagAll();
  window.scrollTo({ top: document.querySelector('.tabs-wrap').offsetTop - 20, behavior: 'smooth' });
  history.replaceState(null, '', '#' + key + (subIdx ? '/watch' : ''));
}

// ─── SAVED VIEW ───────────────────────────────────────────────────────────
const SAVED_GROUP_DEFS = [
  { key: 'movies',      label: 'Movies' },
  { key: 'books',       label: 'Books' },
  { key: 'tv',          label: 'TV Shows' },
  { key: 'movieSeries', label: 'Movie Series' },
];

function findItemByTitle(sectionKey, title) {
  return DATA[sectionKey].items.find(it => it.title === title);
}

function renderSavedView() {
  const root = document.getElementById('saved-view');
  root.innerHTML = '';

  const head = document.createElement('div');
  head.className = 'section-head';
  head.innerHTML = `
    <div class="eyebrow">Your Personal List</div>
    <h2>My Saved</h2>
    <div class="divider"></div>
  `;
  root.appendChild(head);

  if (savedCount() === 0) {
    const empty = document.createElement('div');
    empty.className = 'saved-empty';
    empty.innerHTML = `Nothing saved yet.<div class="hint">Tap the ★ on any card to add it to your personal list.</div>`;
    root.appendChild(empty);
    return;
  }

  SAVED_GROUP_DEFS.forEach(g => {
    const group = document.createElement('div');
    group.className = 'saved-group';
    group.innerHTML = `
      <div class="saved-group-title">${g.label}</div>
      <div class="saved-group-divider"></div>
    `;
    const ids = SAVED[g.key] || [];
    if (ids.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-group';
      empty.textContent = `— No ${g.label.toLowerCase()} saved yet —`;
      group.appendChild(empty);
    } else {
      const grid = document.createElement('div');
      grid.className = 'grid';
      ids.forEach((id, idx) => {
        const [/*tabKey*/, sectionKey, ...titleParts] = id.split('::');
        const title = titleParts.join('::');
        const item = findItemByTitle(sectionKey, title);
        if (!item) return;
        const built = buildCardEl(item, idx, DATA[sectionKey].type, true, sectionKey);
        // hydrate cover from cache (or fetch)
        lookupCover(DATA[sectionKey].type, item.title).then(url => {
          if (!url) return;
          built.card._coverUrl = url;
          const img = new Image();
          img.alt = item.title;
          img.onload = () => { built.cover.innerHTML = ''; built.cover.appendChild(img); };
          img.src = url;
        });
        built.card.classList.add('in-view');
        grid.appendChild(built.card);
      });
      group.appendChild(grid);
      // Apply zigzag layout to this saved-group's grid
      setTimeout(() => applyZigzag(grid), 0);
    }
    root.appendChild(group);
  });
}

// ─── MODAL ────────────────────────────────────────────────────────────────
const modal = document.getElementById('modal');
const modalCover = document.getElementById('modal-cover');
const modalTitle = document.getElementById('modal-title');
const modalMeta  = document.getElementById('modal-meta');
const modalTags  = document.getElementById('modal-tags');
const modalLink  = document.getElementById('modal-link');
document.getElementById('modal-close').addEventListener('click', closeModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

function openModal(item, type, coverUrl) {
  modalCover.innerHTML = '';
  if (coverUrl) {
    const img = document.createElement('img');
    img.src = coverUrl;
    img.alt = item.title;
    modalCover.appendChild(img);
  } else {
    const ph = document.createElement('div');
    ph.className = 'placeholder';
    ph.textContent = item.title.toUpperCase();
    modalCover.appendChild(ph);
  }
  modalTitle.textContent = item.title;
  modalMeta.textContent = type.toUpperCase();
  modalTags.innerHTML = '';
  item.tags.forEach(t => {
    const tagEl = document.createElement('span');
    tagEl.className = 'modal-tag';
    tagEl.textContent = t;
    modalTags.appendChild(tagEl);
  });
  modalLink.href = 'https://www.google.com/search?q=' + encodeURIComponent(item.title + ' ' + type);
  modal.classList.add('open');
}
function closeModal() { modal.classList.remove('open'); }

// ─── BOOT ─────────────────────────────────────────────────────────────────
(function init() {
  // Force re-fetch for entries whose cached cover was wrong / outdated
  ['movie:Wolf of Wall street', 'movie:Gladiator', 'movie:Gladiator 2', 'movie:James bond', 'movie:Dune series'].forEach(k => {
    try { localStorage.removeItem(CACHE_PREFIX + k); } catch(e){}
  });

  const main = document.getElementById('main');
  const sections = SECTION_KEYS.map(buildSection);
  sections.forEach(s => main.appendChild(s.el));
  buildTabs();
  attachIntersection(sections.flatMap(s => s.builtCards));
  applyZigzagAll();
  sections.forEach(loadCovers);

  // Curtain fade on scroll
  const curtain = document.getElementById('curtain-bg');
  const onScroll = () => {
    const y = window.scrollY;
    const op = Math.max(0, 1 - y / 480);
    curtain.style.opacity = op;
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  const hash = (location.hash || '').replace('#','').split('/')[0];
  const validHash = hash === 'saved' ? 'saved' : (TABS.find(t => t.key === hash)?.key);
  activateTab(validHash || 'movies');
})();
